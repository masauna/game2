<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Blaze</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#04040f;overflow:hidden}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ================= 기본 설정 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;
const FONT = '"Orbitron","Segoe UI","Malgun Gothic",sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inCubic = t => t * t * t;
const outBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pick = a => a[(Math.random() * a.length) | 0];
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ================= 글로우 스프라이트 =================
const glowCache = new Map();
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function glowSprite(color) {
  let c = glowCache.get(color); if (c) return c;
  const s = 128; c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.16, color);
  gr.addColorStop(0.45, hexA(color, 0.3)); gr.addColorStop(1, hexA(color, 0));
  g.fillStyle = gr; g.fillRect(0, 0, s, s); glowCache.set(color, c); return c;
}
function glow(color, x, y, r, a = 1) {
  if (r <= 0 || a <= 0) return; ctx.globalAlpha = a;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
}

// ================= 사운드 (WebAudio 합성) =================
let AC = null, master = null, noiseBuf = null, muted = false;
const sndT = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function throttle(name, gap) { if (!AC) return false; const t = AC.currentTime; if (sndT[name] && t - sndT[name] < gap) return false; sndT[name] = t; return true; }
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1200) {
  if (!AC) return; const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  shoot() { if (throttle('shoot', 0.07)) tone(1100, 0.05, 'square', 0.025, 0.45); },
  hit() { if (throttle('hit', 0.05)) tone(380, 0.04, 'sawtooth', 0.04, 0.5); },
  boom(big) { if (!throttle(big ? 'bigboom' : 'boom', big ? 0.1 : 0.035)) return; noise(big ? 1.3 : 0.4, big ? 0.6 : 0.28, big ? 2200 : 1500); tone(big ? 80 : 150, big ? 0.9 : 0.25, 'sine', big ? 0.5 : 0.3, 0.3); },
  power() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'triangle', 0.14, 0, i * 0.06)); },
  hurt() { tone(220, 0.5, 'sawtooth', 0.25, 0.2); noise(0.6, 0.4, 900); },
  shield() { tone(900, 0.2, 'sine', 0.2, 0.4); },
  bomb() { noise(1.6, 0.7, 3500); tone(55, 1.4, 'sine', 0.6, 0.5); tone(220, 0.8, 'sawtooth', 0.12, 0.25); },
  warn() { for (let i = 0; i < 3; i++) { tone(520, 0.22, 'square', 0.1, 0, i * 0.55); tone(390, 0.22, 'square', 0.1, 0, i * 0.55 + 0.25); } },
  wave() { [392, 523, 659].forEach((f, i) => tone(f, 0.18, 'triangle', 0.12, 0, i * 0.08)); },
  graze() { if (throttle('graze', 0.06)) tone(1800, 0.03, 'sine', 0.04); },
};

// ================= 상태 =================
const stars = [], neb = [];
const planet = { x: 0, y: 0, r: 0 };
const P = { x: 0, y: 0, tx: 0, ty: 0, vx: 0, bank: 0, lives: 3, power: 1, shield: 0, bombs: 2, inv: 0, fireT: 0, alive: true, respawnT: 0, missileT: 0, muzzle: 0, trail: [] };
const G = {
  state: 'title', t: 0, score: 0, disp: 0, hi: 0, wave: 0, combo: 0, comboT: 0, comboPop: 0,
  shake: 0, flash: 0, flashC: '#ffffff', hurt: 0, zoom: 0, hitStop: 0, ts: 1, slowT: 0,
  banner: null, queue: [], waveT: 0, clearT: 0, cleared: false, warp: 0, speed: 1, bump: 0,
  paused: false, overT: 0, overDelay: 0, shotN: 0, bombFx: null, bombId: 0, newRec: false, bossRef: null, titleT: 0,
};
try { G.hi = +localStorage.getItem('skyblaze_hi') || 0; } catch (e) { }
let enemies = [], pb = [], eb = [], parts = [], rings = [], texts = [], pups = [];
const keys = {};

function resize() {
  if (!innerWidth || !innerHeight) return;
  const ow = W, oh = H, fresh = !ow || !oh || !stars.length;
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
  const g = vignette.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.7)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (fresh) { initBG(); P.x = P.tx = W / 2; P.y = P.ty = H * 0.72; }
  else {
    for (const s of stars) { s.x *= W / ow; s.y *= H / oh; }
    for (const b of neb) { b.x *= W / ow; b.y *= H / oh; }
  }
  P.tx = clamp(P.tx, 20, W - 20); P.ty = clamp(P.ty, 20, H - 20);
}
function initBG() {
  stars.length = 0; neb.length = 0;
  [[120, 0.6, 45], [60, 1.2, 140], [26, 2.1, 380]].forEach(([n, s, sp], l) => {
    for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s, sp: sp * rand(0.8, 1.2), l, tw: Math.random() * TAU });
  });
  for (let i = 0; i < 6; i++) neb.push({ x: Math.random() * W, y: rand(-0.25, 1.25) * H, r: rand(0.35, 0.7) * Math.max(W, H), h: rand(190, 320), sp: rand(10, 25) });
  planet.x = W * 0.8; planet.y = H * 0.25; planet.r = Math.min(W, H) * 0.2;
}

// ================= 파티클 / 이펙트 =================
function addP(p) { if (parts.length < 2200) parts.push(p); }
function sparks(x, y, color, n, sp = 400, size = 2, life = 0.5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = sp * rand(0.3, 1);
    addP({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * rand(0.5, 1), max: life, size: size * rand(0.6, 1.3), color, drag: 0.9 });
  }
}
function ring(x, y, maxR, color, life = 0.5, w = 5) { rings.push({ x, y, maxR, life, max: life, color, w }); }
function explode(x, y, color, s = 1) {
  addP({ k: 'flash', x, y, vx: 0, vy: 0, life: 0.2, max: 0.2, size: 70 * s, color: '#ffffff' });
  addP({ k: 'flash', x, y, vx: 0, vy: 0, life: 0.45, max: 0.45, size: 120 * s, color });
  ring(x, y, 90 * s, color, 0.55, 8 * s);
  if (s > 1.5) ring(x, y, 170 * s, '#ffffff', 0.9, 4 * s);
  const ss = Math.sqrt(s);
  sparks(x, y, color, Math.round(18 * s), 540 * ss, 2.4, 0.6);
  sparks(x, y, '#ffeeaa', Math.round(10 * s), 320 * ss, 1.6, 0.5);
  for (let i = 0; i < 8 * s; i++) { const a = Math.random() * TAU, v = rand(30, 120) * s; addP({ k: 'smoke', x: x + rand(-10, 10) * s, y: y + rand(-10, 10) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 40, life: rand(0.6, 1.2), max: 1.2, size: rand(14, 26) * ss, drag: 0.94 }); }
  for (let i = 0; i < 6 * s; i++) { const a = Math.random() * TAU, v = rand(150, 400) * ss; addP({ k: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.1), max: 1.1, size: rand(3, 7), color, rot: Math.random() * TAU, vr: rand(-12, 12), drag: 0.96 }); }
  for (let i = 0; i < 5 * s; i++) { const a = Math.random() * TAU, v = rand(40, 160) * s; addP({ k: 'ember', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, size: rand(10, 22) * ss, color: '#ff8a2a', drag: 0.92 }); }
  G.shake = Math.max(G.shake, 5 * s);
}
function popText(x, y, text, color = '#ffffff', size = 16, big = false, life = 0.9, vy = -60) { texts.push({ x, y, text, color, size, big, life, max: life, vy }); }
function bigText(text, color, y = H * 0.32, size = 40) { popText(W / 2, y, text, color, Math.min(size, W * 0.09), true, 1.4, -18); }
function addScore(p) { G.score += p; G.bump = 1; }
function popBullets() { for (const b of eb) addP({ k: 'flash', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 16, color: b.color }); eb.length = 0; }

// ================= 적 =================
const ET = {
  dart: { hp: 2, r: 16, score: 100, color: '#ff3b5c' },
  weaver: { hp: 4, r: 18, score: 150, color: '#c45bff' },
  gunner: { hp: 12, r: 26, score: 400, color: '#ff9a1f' },
  spinner: { hp: 22, r: 30, score: 700, color: '#22e0ff' },
  boss: { hp: 800, r: 90, score: 20000, color: '#ff2d6f' },
};
function spawnE(type, x, y, o) {
  const d = ET[type], hpMul = 1 + (G.wave - 1) * 0.12;
  const e = Object.assign({ type, x, y, vx: 0, vy: 0, hp: d.hp * hpMul, r: d.r, score: d.score, color: d.color, t: 0, flash: 0, ang: 0, aim: Math.PI / 2, fireT: rand(0.8, 1.6), spawn: 0 }, o || {});
  e.maxHp = e.hp; enemies.push(e); return e;
}
const angTo = e => Math.atan2(P.y - e.y, P.x - e.x);
function eShot(x, y, a, sp, color = '#ff4d8d', r = 5) { eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, color, t: 0 }); }

function buildWave(n) {
  const q = [], add = (t, f) => q.push({ t, f });
  if (n % 5 === 0) { add(1.6, spawnBoss); return q; }
  let t = 1.4; const groups = 4 + Math.min(n, 7);
  const kinds = ['vee', 'rain']; if (n >= 2) kinds.push('snake'); if (n >= 3) kinds.push('gunners'); if (n >= 4) kinds.push('spinner'); if (n >= 6) kinds.push('mix');
  for (let g = 0; g < groups; g++) {
    const k = pick(kinds);
    if (k === 'vee') { const cx = rand(0.25, 0.75) * W; for (let i = 0; i < 7; i++) { const off = i - 3; add(t + Math.abs(off) * 0.12, () => spawnE('dart', cx + off * 34, -30 - Math.abs(off) * 10, { speed: 300 + n * 12 })); } }
    else if (k === 'rain') { for (let i = 0; i < 8 + n; i++) add(t + i * 0.18, () => spawnE('dart', rand(0.08, 0.92) * W, -30, { speed: rand(260, 380) + n * 10 })); }
    else if (k === 'snake') { const bx = rand(0.3, 0.7) * W, ph = Math.random() * TAU; for (let i = 0; i < 7; i++) add(t + i * 0.22, () => spawnE('weaver', bx, -30, { baseX: bx, amp: Math.min(W * 0.32, 260), freq: 2.2, phase: ph, speed: 150 + n * 6 })); }
    else if (k === 'gunners') { const c = n >= 7 ? 3 : 2; for (let i = 0; i < c; i++) { const x = W * (i + 1) / (c + 1); add(t + i * 0.3, () => spawnE('gunner', x, -50, { startY: -50, stopY: rand(0.15, 0.32) * H })); } }
    else if (k === 'spinner') add(t, () => spawnE('spinner', rand(0.25, 0.75) * W, -50, { stopY: rand(0.18, 0.3) * H }));
    else if (k === 'mix') { add(t, () => spawnE('spinner', W * 0.5, -50, { stopY: H * 0.22 })); for (let i = 0; i < 6; i++) add(t + 0.5 + i * 0.15, () => spawnE('dart', i < 3 ? W * 0.15 : W * 0.85, -30, { speed: 340 })); }
    t += Math.max(1.6, 3.2 - n * 0.12) + (k === 'spinner' || k === 'gunners' ? 1 : 0);
  }
  return q.sort((a, b) => a.t - b.t);
}

function spawnBoss() {
  G.banner = { text: 'WARNING', sub: '거대 전함이 접근 중입니다', t: 0, dur: 3, warn: true }; sfx.warn();
  const tier = Math.round(G.wave / 5);
  const b = spawnE('boss', W / 2, -200, { startY: -200, stopY: Math.min(H * 0.2, 170), pattern: 0, pT: 0, rage: false, tier, rx: 135, ry: 58 });
  b.hp = b.maxHp = 700 + tier * 500; b.dispHp = b.hp; G.bossRef = b;
}

function updEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt; e.flash -= dt; e.spawn = Math.min(1, e.spawn + dt * 3);
    switch (e.type) {
      case 'dart':
        if (e.t < 0.7) e.vx = lerp(e.vx, clamp((P.x - e.x) * 1.5, -260, 260), 1 - Math.exp(-dt * 3));
        e.vy = e.speed; e.x += e.vx * dt; e.y += e.vy * dt; e.ang = Math.atan2(e.vy, e.vx) - Math.PI / 2;
        if (Math.random() < 0.5) addP({ k: 'ember', x: e.x - e.vx * 0.03, y: e.y - 16, vx: 0, vy: -60, life: 0.2, max: 0.2, size: 8, color: e.color });
        break;
      case 'weaver': {
        e.y += e.speed * dt; const nx = e.baseX + Math.sin(e.t * e.freq + e.phase) * e.amp;
        e.vx = (nx - e.x) / dt; e.x = nx; e.ang = -clamp(e.vx / 600, -0.6, 0.6);
        e.fireT -= dt; if (e.fireT <= 0 && e.y > 0 && e.y < H * 0.6) { e.fireT = rand(1.6, 2.6); eShot(e.x, e.y + 12, angTo(e), 220, '#ff5cd0', 5); }
        break;
      }
      case 'gunner':
        e.aim = angTo(e);
        if (e.t < 1.2) e.y = lerp(e.startY, e.stopY, outCubic(e.t / 1.2));
        else if (e.t < 5) {
          e.x += Math.sin(e.t * 1.5) * 40 * dt; e.fireT -= dt;
          if (e.fireT <= 0) {
            e.fireT = G.wave >= 6 ? 0.55 : 0.8;
            for (let k = -1; k <= 1; k++) eShot(e.x + Math.cos(e.aim) * 26, e.y + Math.sin(e.aim) * 26, e.aim + k * 0.18, 240, '#ffb02e', 5);
            addP({ k: 'flash', x: e.x + Math.cos(e.aim) * 26, y: e.y + Math.sin(e.aim) * 26, vx: 0, vy: 0, life: 0.12, max: 0.12, size: 26, color: '#ffb02e' });
          }
        } else { e.vy += 300 * dt; e.y += e.vy * dt; }
        break;
      case 'spinner':
        e.y += (e.y < e.stopY ? 140 : 12) * dt; e.ang += dt * 1.8; e.fireT -= dt;
        if (e.fireT <= 0 && e.t > 1) {
          e.fireT = 1.5; const N = 10 + Math.min(G.wave, 8);
          for (let k = 0; k < N; k++) eShot(e.x, e.y, e.ang + k * TAU / N, 150 + G.wave * 4, '#3ff0ff', 5);
          ring(e.x, e.y, 50, e.color, 0.3, 3);
        }
        break;
      case 'boss': updBoss(e, dt); break;
    }
    if (e.type !== 'boss' && e.t > 1 && (e.y > H + 80 || e.x < -120 || e.x > W + 120)) e.dead = true;
  }
}

function updBoss(b, dt) {
  if (b.dying) {
    b.dyingT -= dt; b.x += rand(-2, 2); b.y += 20 * dt;
    if (Math.random() < dt * 18) { explode(b.x + rand(-120, 120), b.y + rand(-50, 50), pick([b.color, '#ffaa33', '#ffffff']), rand(0.6, 1.3)); sfx.boom(false); }
    if (b.dyingT <= 0) bossFinal(b);
    return;
  }
  b.dispHp = lerp(b.dispHp, b.hp, 1 - Math.exp(-dt * 3));
  if (b.t < 2.8) { b.y = lerp(b.startY, b.stopY, outBack(b.t / 2.8)); return; }
  const t2 = b.t - 2.8;
  b.x = W / 2 + Math.sin(t2 * 0.45) * Math.min(W * 0.3, 320); b.y = b.stopY + Math.sin(t2 * 1.1) * 18;
  if (!b.rage && b.hp < b.maxHp * 0.5) {
    b.rage = true; b.color = '#ff4422'; G.flash = 0.5; G.flashC = '#ff3355'; G.shake = 22; G.zoom = 1;
    ring(b.x, b.y, 300, '#ff4422', 0.8, 10); bigText('RAGE MODE', '#ff4466'); sfx.warn();
    spawnE('gunner', W * 0.2, -50, { startY: -50, stopY: H * 0.35 }); spawnE('gunner', W * 0.8, -50, { startY: -50, stopY: H * 0.35 });
  }
  b.pT += dt; if (b.pT > 5.5) { b.pT = 0; b.pattern = (b.pattern + 1) % 3; b.fireT = 0.6; }
  b.fireT -= dt; if (b.fireT > 0) return;
  const R = b.rage;
  switch (b.pattern) {
    case 0: {
      b.fireT = R ? 0.05 : 0.075; const arms = R ? 3 : 2;
      for (let k = 0; k < arms; k++) eShot(b.x, b.y + 10, t2 * 2.6 + k * TAU / arms, R ? 230 : 190, '#ff4d8d', 5.5);
      if (R) for (let k = 0; k < arms; k++) eShot(b.x, b.y + 10, -t2 * 2.6 + k * TAU / arms, 170, '#ffd04d', 4.5);
      break;
    }
    case 1: {
      b.fireT = R ? 0.6 : 0.9; const a = angTo(b), N = R ? 13 : 9, spread = R ? 1.3 : 1;
      for (let k = 0; k < N; k++) eShot(b.x, b.y + 40, a - spread / 2 + spread * k / (N - 1), R ? 300 : 250, '#ffb02e', 6);
      addP({ k: 'flash', x: b.x, y: b.y + 40, vx: 0, vy: 0, life: 0.2, max: 0.2, size: 60, color: '#ffb02e' });
      break;
    }
    case 2: {
      b.fireT = R ? 0.85 : 1.2; const N = R ? 28 : 20, off = Math.random() * TAU;
      for (let k = 0; k < N; k++) eShot(b.x, b.y, off + k * TAU / N, 160, '#c45bff', 6);
      for (const s of [-1, 1]) { const tx = b.x + s * 85, ty = b.y + 15, a = Math.atan2(P.y - ty, P.x - tx); for (let k = 0; k < 3; k++) eShot(tx, ty, a, 330 + k * 40, '#ff4d8d', 4.5); }
      ring(b.x, b.y, 120, '#c45bff', 0.4, 5);
      break;
    }
  }
}

function damage(e, d) {
  if (e.dead || e.dying) return;
  if (e.type === 'boss' && e.t < 2.8) d *= 0.3;
  e.hp -= d; e.flash = 0.05; sfx.hit();
  if (e.hp <= 0) {
    if (e.type === 'boss') {
      e.dying = true; e.dyingT = 2.4; G.slowT = 0.8; popBullets(); G.shake = 20;
      bigText('CRITICAL!', '#ffd23f');
    } else kill(e);
  }
}
function kill(e) {
  e.dead = true; explode(e.x, e.y, e.color, e.r / 18);
  G.combo++; G.comboT = 2.2; G.comboPop = 1;
  const mult = 1 + Math.min(G.combo, 50) * 0.1, pts = Math.round(e.score * mult / 10) * 10;

    }
    x += w;
  });
  // 스캔 라인 하이라이트
  const sweep = ((t * 0.5) % 1.6) - 0.3;
  if (sweep > 0 && sweep < 1) { ctx.globalCompositeOperation = 'lighter'; const sxp = W / 2 - total / 2 + total * sweep; const lg = ctx.createLinearGradient(sxp - 60, 0, sxp + 60, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.25)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = lg; ctx.fillRect(sxp - 60, cy - fs * 0.6, 120, fs * 1.2); ctx.globalCompositeOperation = 'source-over'; }
  const sa = clamp((t - 0.9) / 0.5, 0, 1);
  ctx.globalAlpha = sa; ctx.font = `700 ${Math.min(W * 0.04, 17)}px ${FONT}`; ctx.fillStyle = '#bfe6ff'; ctx.fillText('스카이 블레이즈 · 아케이드 슈팅', W / 2, cy + fs * 0.75);
  ctx.globalAlpha = sa * (0.55 + 0.45 * Math.sin(t * 4));
  ctx.font = `900 ${Math.min(W * 0.045, 20)}px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#29c6ff'; ctx.shadowBlur = 16;
  ctx.fillText(isTouch ? '화면을 터치해서 시작' : 'CLICK 또는 SPACE로 시작', W / 2, H * 0.52); ctx.shadowBlur = 0;
  ctx.globalAlpha = sa * 0.75; ctx.font = `600 ${Math.min(W * 0.032, 13)}px ${FONT}`; ctx.fillStyle = '#9fb6d9';
  ctx.fillText(isTouch ? '드래그로 이동 · 자동 발사 · BOMB 버튼으로 폭탄' : '마우스 / 방향키·WASD 이동 · 자동 발사 · 우클릭 / B 폭탄 · P 일시정지 · M 음소거', W / 2, H * 0.52 + 34);
  ctx.fillText('BEST  ' + G.hi.toLocaleString(), W / 2, H * 0.52 + 58);
  ctx.restore();
}
function drawOver(raw) {
  G.overT += raw; const t = G.overT;
  ctx.fillStyle = `rgba(5,2,15,${Math.min(0.65, t * 0.8)})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); const fs = Math.min(W * 0.11, 84); ctx.font = `900 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const txt = 'GAME OVER', widths = [...txt].map(c => ctx.measureText(c).width + fs * 0.04), total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2; const cy = H * 0.34;
  [...txt].forEach((c, i) => {
    const p = clamp((t - i * 0.07) / 0.6, 0, 1);
    if (p > 0) {
      ctx.save(); ctx.translate(x + widths[i] / 2, cy - (1 - outBack(p)) * 220 + Math.sin(t * 2 + i) * 3); ctx.rotate((1 - p) * (i % 2 ? 0.6 : -0.6)); ctx.globalAlpha = p;
      const gr = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); gr.addColorStop(0, '#ffd0d8'); gr.addColorStop(1, '#ff2d55');
      ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 26; ctx.fillStyle = gr; ctx.fillText(c, 0, 0); ctx.restore();
    }
    x += widths[i];
  });
  const sp = outCubic(clamp((t - 0.8) / 1, 0, 1));
  ctx.globalAlpha = clamp((t - 0.7) / 0.3, 0, 1);
  ctx.font = `600 ${Math.min(W * 0.035, 14)}px ${FONT}`; ctx.fillStyle = '#c8d4ff'; ctx.fillText('SCORE', W / 2, cy + fs * 0.85);
  ctx.font = `900 ${Math.min(W * 0.08, 44)}px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#29c6ff'; ctx.shadowBlur = 18;
  ctx.fillText(Math.floor(G.score * sp).toLocaleString(), W / 2, cy + fs * 0.85 + 38); ctx.shadowBlur = 0;
  ctx.font = `600 ${Math.min(W * 0.033, 13)}px ${FONT}`; ctx.fillStyle = '#9fb6d9';
  ctx.fillText('WAVE ' + G.wave + ' 도달 · BEST ' + G.hi.toLocaleString(), W / 2, cy + fs * 0.85 + 76);
  if (G.newRec && t > 1.8) {
    const s = 1 + Math.sin(t * 8) * 0.08; ctx.save(); ctx.translate(W / 2, cy + fs * 0.85 + 108); ctx.scale(s, s);
    ctx.font = `900 ${Math.min(W * 0.05, 22)}px ${FONT}`; ctx.fillStyle = `hsl(${(t * 200) % 360},100%,65%)`; ctx.fillText('★ NEW RECORD ★', 0, 0); ctx.restore();
  }
  if (t > 1.2) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4); ctx.font = `900 ${Math.min(W * 0.042, 18)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(isTouch ? '터치해서 다시 시작' : 'CLICK 또는 SPACE로 다시 시작', W / 2, H * 0.78); }
  ctx.restore();
}

function render(raw) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBG();
  G.shake = Math.min(G.shake, 45) * Math.exp(-raw * 7); if (G.shake < 0.3) G.shake = 0;
  G.zoom = Math.max(0, G.zoom - raw * 3);
  ctx.save();
  if (G.zoom > 0) { const z = 1 + outCubic(G.zoom / 1.5) * 0.05; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); }
  ctx.translate((Math.random() * 2 - 1) * G.shake, (Math.random() * 2 - 1) * G.shake);
  drawParts('normal'); drawPups();
  for (const e of enemies) e.type === 'boss' ? drawBoss(e) : drawEnemy(e);
  drawPB(); drawPlayer(); drawEB(); drawParts('add'); drawRings(); drawBombFx(); drawTexts();
  ctx.restore();
  ctx.drawImage(vignette, 0, 0, W, H);
  if (G.hurt > 0) {
    G.hurt = Math.max(0, G.hurt - raw * 1.2);
    const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    gr.addColorStop(0, 'rgba(255,0,40,0)'); gr.addColorStop(1, `rgba(255,0,40,${G.hurt * 0.6})`); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) { ctx.globalAlpha = clamp(G.flash, 0, 1) * 0.7; ctx.fillStyle = G.flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; G.flash -= raw * 2.5; }
  if (G.state !== 'title') drawHUD(raw);
  drawBanner(raw);
  if (G.state === 'title') drawTitle(raw);
  if (G.state === 'over') drawOver(raw);
  if (G.paused) {
    ctx.fillStyle = 'rgba(0,0,10,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.font = `900 ${Math.min(W * 0.1, 56)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.fillText('PAUSED', W / 2, H / 2); ctx.font = `600 14px ${FONT}`; ctx.fillStyle = '#9fb6d9'; ctx.fillText(isTouch ? '터치해서 계속' : 'P 또는 클릭으로 계속', W / 2, H / 2 + 44);
  }
  cv.style.cursor = G.state === 'play' && !G.paused ? 'none' : 'pointer';
}

// ================= 루프 =================
let last = performance.now();
function frame(now) {
  const raw = Math.min((now - last) / 1000, 1 / 20); last = now;
  if (!G.paused) {
    if (G.slowT > 0) G.slowT -= raw;
    G.ts = lerp(G.ts, G.slowT > 0 ? 0.25 : 1, 1 - Math.exp(-raw * 8));
    let dt = raw * G.ts;
    if (G.hitStop > 0) { G.hitStop -= raw; dt = 0; }
    if (dt > 0) update(dt, raw);
    if (G.overDelay > 0) { G.overDelay -= raw; if (G.overDelay <= 0) finishGame(); }
  }
  render(G.paused ? 0 : raw);
  requestAnimationFrame(frame);
}

// ================= 입력 =================
let drag = null;
function canRestart() { return G.state === 'title' || (G.state === 'over' && G.overT > 1.2); }
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; initAudio();
  if ((e.code === 'Space' || e.code === 'Enter') && canRestart()) startGame();
  if (G.state === 'play' && (e.code === 'KeyB' || e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight')) bomb();
  if (G.state === 'play' && (e.code === 'KeyP' || e.code === 'Escape')) G.paused = !G.paused;
  if (e.code === 'KeyM' && master) { muted = !muted; master.gain.value = muted ? 0 : 0.32; }
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (canRestart()) { startGame(); if (e.pointerType === 'mouse') { P.tx = e.clientX; P.ty = e.clientY; } return; }
  if (G.state !== 'play') return;
  if (G.paused) { G.paused = false; return; }
  if (e.button === 2) { bomb(); return; }
  if (e.pointerType !== 'mouse') {
    if (isTouch && Math.hypot(e.clientX - (W - 58), e.clientY - (H - 66)) < 44) { bomb(); return; }
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: P.alive ? P.x : P.tx, py: P.alive ? P.y : P.ty };
  }
});
cv.addEventListener('pointermove', e => {
  if (G.state !== 'play' || G.paused) return;
  if (e.pointerType === 'mouse') { P.tx = e.clientX; P.ty = e.clientY; }
  else if (drag && drag.id === e.pointerId) { P.tx = drag.px + (e.clientX - drag.sx) * 1.3; P.ty = drag.py + (e.clientY - drag.sy) * 1.3; }
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('blur', () => { if (G.state === 'play') G.paused = true; for (const k in keys) keys[k] = false; });
addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);
</script>
</body>
